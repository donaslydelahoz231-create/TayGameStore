# Actualizaciones automáticas de dependencias (propuestas como PR; la CI las valida).
# Dependabot lee este archivo de la rama por defecto del repositorio.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      # Parches y versiones menores juntos: un PR por grupo y semana.
      produccion:
        dependency-type: production
        update-types: [minor, patch]
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Debe coincidir con la versión de Node del servidor (24 LTS, .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Bogota
    groups:
      acciones:
        patterns: ['*']
