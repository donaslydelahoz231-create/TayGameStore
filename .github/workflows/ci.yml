name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # El esquema (schema.ts) y las migraciones deben coincidir: si alguien cambia el esquema
      # sin generar su migración, drizzle-kit crearía archivos nuevos y el paso falla.
      - name: Esquema y migraciones sincronizados
        run: |
          npx drizzle-kit generate
          git diff --exit-code -- src/server/db/migrations
          test -z "$(git status --porcelain -- src/server/db/migrations)"
      - run: npm test
      - run: npm run build
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integración con PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        # Credenciales desechables, solo para este contenedor de CI.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: taygamestore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d taygamestore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/taygamestore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: End-to-end ${{ matrix.browser }} (Playwright + PostgreSQL)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Chromium = Chrome/Edge/Android; Firefox; WebKit = motor de Safari (iPhone/Mac).
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16
        # Credenciales desechables, solo para este contenedor de CI.
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: taygamestore_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d taygamestore_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://ci:ci@localhost:5432/taygamestore_e2e_test
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Las referencias visuales (test:visual) no se ejecutan aquí: dependen del motor de
      # render y de las fuentes del sistema con que se generaron.
      - run: npm run test:e2e

  secrets:
    name: Secretos en el historial (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI oficial (licencia MIT) en lugar de gitleaks-action@v2, que exige una licencia de pago
      # en repositorios de organizaciones. Versión fijada y verificada con el checksums.txt
      # publicado en la misma release oficial.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version
      - name: Buscar secretos en todo el historial
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
