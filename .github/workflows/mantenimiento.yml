
name: Mantenimiento automático

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mantenimiento
  cancel-in-progress: false

jobs:
  autofix:
    name: Correcciones automáticas
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Aplicar correcciones
        run: |
          npm audit fix || true
          npx eslint . --fix || true
          npx prettier --write . > /dev/null

      - name: ¿Hay cambios?
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Comprobar que todo sigue pasando
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Abrir pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: mantenimiento/automatico
          delete-branch: false
          commit-message: "chore: correcciones automáticas de mantenimiento"
          title: "Mantenimiento automático"
          body: |
            Correcciones automáticas:
            - npm audit fix sin --force
            - ESLint
            - Prettier

            Las comprobaciones de lint, tipos, pruebas y build
            deben pasar antes de integrar los cambios.
          base: ${{ github.ref_name }}
