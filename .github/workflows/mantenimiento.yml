name: Mantenimiento automático

# Cada lunes aplica las correcciones automáticas seguras y, si algo cambió y las comprobaciones
# pasan, propone un pull request para revisarlo (nunca hace push a la rama principal):
#   - npm audit fix sin --force (solo versiones compatibles),
#   - eslint --fix y prettier --write.
# Las actualizaciones de versión las propone Dependabot (.github/dependabot.yml).
#
# El pull request lo abre peter-evans/create-pull-request en la rama fija mantenimiento/automatico:
# se actualiza cada semana en vez de crear una rama por día (el 2026-11-11 una segunda ejecución
# falló con «failed to push some refs» porque la rama del día ya existía).
# Requisito del repositorio: Settings → Actions → General → Workflow permissions → «Allow GitHub
# Actions to create and approve pull requests». Sin esa opción, GitHub no deja abrir el pull request
# con GITHUB_TOKEN (ejecución 42711314173) y este paso falla.
# Los pull requests creados con GITHUB_TOKEN no disparan otros workflows: la CI se ejecuta al hacer
# cualquier push a esa rama o al reabrir el pull request.

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mantenimiento
  cancel-in-progress: false

jobs:
  autofix:
    name: Correcciones automáticas
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Aplicar correcciones
        run: |
          npm audit fix || true
          npx eslint . --fix || true
          npx prettier --write . > /dev/null

      - name: ¿Hay cambios?
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Comprobar que todo sigue pasando
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Abrir pull request
        if: steps.diff.outputs.changed == 'true'
        # Acción de terceros con permiso de escritura: fijada a un commit (Dependabot la actualiza).
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.token }}
          branch: mantenimiento/automatico
          delete-branch: false
          commit-message: 'chore: correcciones automáticas de mantenimiento'
          title: 'Mantenimiento automático'
          body: |
            Correcciones automáticas:
            - npm audit fix sin --force
            - ESLint
            - Prettier

            Las comprobaciones de lint, tipos, pruebas y build
            deben pasar antes de integrar los cambios.
          base: ${{ github.ref_name }}
