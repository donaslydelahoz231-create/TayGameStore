name: Production smoke check

on:
  push:
    branches:
      - claude/taygamestore-production-pfctbn
  pull_request:
    branches:
      - claude/taygamestore-production-pfctbn
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Check production web, liveness and readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Probe production endpoints
        env:
          BASE_URL: https://taygamestore.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.BASE_URL);
          if (base.protocol !== 'https:' || base.hostname !== 'taygamestore.onrender.com') {
            console.error('Refusing unexpected production URL');
            process.exit(1);
          }
          const probes = [
            { path: '/', label: 'web', check: (r, b) => r.status === 200 && (r.headers.get('content-type') || '').includes('text/html') && b.length > 0 },
            { path: '/api/health', label: 'liveness', check: (r, b) => r.status === 200 && b?.status === 'ok' },
            { path: '/api/ready', label: 'readiness-database', check: (r, b) => r.status === 200 && b?.status === 'ready' && b?.checks?.database === 'ok' },
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 15; attempt++) {
            const results = await Promise.all(probes.map(async p => {
              try {
                const r = await fetch(new URL(p.path, base), { redirect: 'manual', signal: AbortSignal.timeout(8000) });
                const raw = await r.text();
                let body = raw;
                if (p.path !== '/') { try { body = JSON.parse(raw); } catch { body = null; } }
                return { label: p.label, status: r.status, ok: p.check(r, body) };
              } catch (e) {
                return { label: p.label, status: e?.name || 'network-error', ok: false };
              }
            }));
            console.log('Attempt ' + attempt + ': ' + results.map(r => r.label + '=' + r.status).join(' '));
            if (results.every(r => r.ok)) {
              console.log('Production smoke check passed.');
              process.exit(0);
            }
            if (attempt < 15) await sleep(15000);
          }
          console.error('Production smoke check failed; inspect Render, DNS and database readiness.');
          process.exit(1);
          NODE
      - name: Support channels published (WhatsApp and email bubbles)
        env:
          BASE_URL: https://taygamestore.onrender.com
        run: |
          node --input-type=module <<'NODE'
          // Solo dice si cada canal está publicado: nunca imprime el número ni el correo.
          const res = await fetch(new URL('/api/config', process.env.BASE_URL), {
            signal: AbortSignal.timeout(15000),
          });
          const body = await res.json().catch(() => null);
          const wa = Boolean(body?.support?.whatsapp);
          const mail = Boolean(body?.support?.email);
          console.log(`WhatsApp: ${wa ? 'publicado' : 'FALTA'} · Correo: ${mail ? 'publicado' : 'FALTA'}`);
          if (!wa || !mail) console.log('::warning::Falta un canal de soporte (SUPPORT_WHATSAPP / SUPPORT_EMAIL en Render).');
          NODE
      # Navegador real contra la tienda publicada: la burbuja de WhatsApp se ve a la derecha
      # dentro de la tienda y no en la bienvenida (el dueño lo pidió el 2026-10-11).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Burbujas de soporte en la tienda publicada (navegador real)
        run: node tools/smoke/burbujas.mjs https://taygamestore.onrender.com
