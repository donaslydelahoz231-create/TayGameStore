name: Tareas programadas

# Llama cada 10 minutos a /api/internal/jobs de la tienda publicada (vencer pedidos, conciliar
# pagos con Mercado Pago si un webhook no llegó, reintentar correos y avisos, liberar entregas).
# Las tareas son idempotentes y usan locks en PostgreSQL: repetirlas no duplica pagos ni entregas.
# GitHub puede retrasar los flujos programados unos minutos; no sustituye al webhook, lo respalda.
#
# - Render gratuito: además mantiene la tienda despierta (sin visitas se dormiría y las tareas
#   no correrían). Ver docs/despliegue-gratis.md.
# - Vercel: en el plan Hobby, Vercel Cron solo corre una vez al día.
#
# Configuración: variable PRODUCTION_URL y secreto CRON_SECRET (el mismo valor que en el
# hosting). Sin ellos no hace nada.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tareas
  cancel-in-progress: false

jobs:
  tareas:
    name: Ejecutar tareas del servidor
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      URL: ${{ vars.PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Llamar a /api/internal/jobs
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Sin secreto CRON_SECRET: nada que hacer."
            exit 0
          fi
          status=$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "${URL%/}/api/internal/jobs")
          echo "Respuesta: $status"
          if [ "$status" != "200" ]; then
            echo "::error::/api/internal/jobs respondió $status (404: CRON_SECRET no coincide con el del hosting)."
            exit 1
          fi
