# Blueprint de Render para TayGameStore (staging o producción).
# Referencia: https://render.com/docs/blueprint-spec
# Antes de aplicarlo: lee docs/deployment.md. Los secretos (sync: false) se escriben en el panel
# de Render, nunca en este archivo. Arranca con ventas y pagos APAGADOS.

services:
  - type: web
    name: taygamestore
    runtime: node
    # Instancia de pago: el plan gratuito se suspende sin tráfico (webhooks y tareas
    # programadas fallarían) y no permite preDeployCommand.
    plan: starter
    # Región de EE. UU. más cercana a Colombia. [A VERIFICAR en el panel]
    region: virginia
    # UNA instancia: el rate limiting vive en la memoria del proceso.
    numInstances: 1
    # --include=dev: con NODE_ENV=production npm omite devDependencies, y el build necesita
    # Vite y TypeScript. En ejecución solo se usan las dependencias de producción.
    buildCommand: npm ci --include=dev && npm run build
    # Migraciones antes de publicar la versión nueva (solo aditivas, nunca al arrancar).
    preDeployCommand: npm run db:migrate:prod
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: SERVE_WEB
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: taygamestore-db
          property: connectionString
      # Interruptores: se activan a mano siguiendo docs/deployment.md.
      - key: MAINTENANCE_MODE
        value: 'false'
      - key: CHECKOUT_ENABLED
        value: 'false'
      - key: PAYMENTS_ENABLED
        value: 'false'
      # sandbox hasta completar docs/sandbox-mercadopago.md; luego production.
      - key: MP_MODE
        value: sandbox
      # ── Se escriben en el panel de Render (secretos o datos del propietario) ──
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ORDER_TOKEN_KEYS
        sync: false
      - key: MFA_ENCRYPTION_KEYS
        sync: false
      - key: IP_HASH_PEPPER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Login de clientes con Discord y Facebook (opcional: vacío = botón deshabilitado).
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false

databases:
  - name: taygamestore-db
    databaseName: taygamestore
    user: taygamestore
    # El plan gratuito de PostgreSQL caduca: usa uno de pago con backups. Nombre del plan
    # [A VERIFICAR en el panel de Render; si no existe, Render rechaza el Blueprint].
    plan: basic-256mb
    postgresMajorVersion: '16'
    region: virginia
    # Sin acceso desde Internet: solo la red privada de Render.
    ipAllowList: []
