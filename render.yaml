# Blueprint de Render para TayGameStore, en el PLAN GRATUITO (guía: docs/despliegue-gratis.md).
# Referencia: https://render.com/docs/blueprint-spec
# Base de datos: PostgreSQL gratuito de Neon (neon.tech); su cadena de conexión va en
# DATABASE_URL. Los secretos (sync: false) se escriben en el panel de Render, nunca aquí.
# Arranca con ventas y pagos APAGADOS.
#
# Para pasar a un plan de pago (no se duerme, despliegues sin corte): plan: starter y mueve
# `npm run db:migrate:prod` del buildCommand a `preDeployCommand` (ver docs/deployment.md).

services:
  - type: web
    name: taygamestore
    runtime: node
    # Gratis: Render se duerme tras inactividad. El programador interno usa JOBS_IDLE_MINUTES
    # para reducir el consumo de Neon. El respaldo de GitHub `tareas.yml` queda desactivado
    # salvo que se habilite explícitamente con ENABLE_SCHEDULED_TASKS=true, PRODUCTION_URL y
    # CRON_SECRET; no se utiliza como mecanismo para mantener despierto el servicio.
    # Lo mantiene activo `mantener-activa.yml` (GitHub, /api/health cada 10 min, sin tocar Neon).
    plan: free
    # Región de EE. UU. más cercana a Colombia. [A VERIFICAR en el panel]
    region: virginia
    # UNA instancia: el rate limiting vive en la memoria del proceso.
    numInstances: 1
    # --include=dev: con NODE_ENV=production npm omite devDependencies, y el build necesita
    # Vite y TypeScript. En ejecución solo se usan las dependencias de producción.
    # El plan gratuito no admite preDeployCommand: las migraciones (solo aditivas) se aplican
    # al final de la compilación, antes de publicar la versión nueva.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate:prod
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: SERVE_WEB
        value: 'true'
      # Cadena de conexión de Neon (con ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Llave de /api/internal/jobs: la misma en Render y en los secretos de GitHub.
      - key: CRON_SECRET
        sync: false
      # Interruptores: se activan a mano siguiendo docs/deployment.md.
      - key: MAINTENANCE_MODE
        value: 'false'
      - key: CHECKOUT_ENABLED
        value: 'false'
      - key: PAYMENTS_ENABLED
        value: 'false'
      # sandbox hasta completar docs/sandbox-mercadopago.md; luego production.
      - key: MP_MODE
        value: sandbox
      # El cliente confirma su ID (escrito dos veces) y paga sin esperar al equipo.
      - key: PLAYER_VERIFICATION
        value: customer
      # true: con PIN en Panel → Inventario, cada pedido pagado se entrega solo (docs/procedimiento-diamantes.md).
      - key: PIN_AUTO_DELIVERY
        value: 'false'
      # true: solo se vende un paquete con PIN libre; los demás salen «Agotado» (sin entregas a mano).
      - key: SELL_ONLY_WITH_STOCK
        value: 'false'
      # Ganancia garantizada con el costo de UniPin (docs/estrategia-promociones.md): comisión del
      # pago (verifícala en tu panel de Mercado Pago) y ganancia mínima, en %.
      - key: PAYMENT_FEE_PCT
        value: '4'
      - key: MIN_MARGIN_PCT
        value: '5'
      # true: nadie cambia precios ni paquetes desde el panel (docs/seguridad-tienda.md, punto 3).
      - key: CATALOG_LOCKED
        value: 'true'
      # Recarga directa al ID con UniPin (sin PIN): none o unipin (docs/recarga-directa-unipin.md).
      # Con unipin, UNIPIN_PARTNER_ID, UNIPIN_SECRET_KEY y UNIPIN_CATALOG van en el panel.
      - key: TOPUP_PROVIDER
        value: none
      - key: UNIPIN_ENV
        value: production
      # ── Se escriben en el panel de Render (secretos o datos del propietario) ──
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ORDER_TOKEN_KEYS
        sync: false
      - key: MFA_ENCRYPTION_KEYS
        sync: false
      - key: IP_HASH_PEPPER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Dirección secreta del panel, p. ej. /gestion-k7Q2x9LmP4vR (no la compartas).
      - key: ADMIN_PATH
        sync: false
      # Login de clientes con Facebook (opcional: vacío = botón deshabilitado).
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      # Frase de activación del dueño (contraseña y primera huella del panel).
      - key: ADMIN_SETUP_CODE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      # Datos del vendedor para términos y privacidad (los escribes tú en Render, nunca en Git).
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_ID
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_DELIVERY_TIME
        sync: false
      - key: LEGAL_REFUND_TIME
        sync: false
      - key: LEGAL_RESPONSE_TIME
        sync: false
      - key: LEGAL_TAX_NOTE
        sync: false
      - key: LEGAL_RETENTION
        sync: false
      # Eventos de pedidos hacia un webhook externo (opcional; ya no se usa n8n: ver
      # docs/automatizacion.md).
      - key: EVENTS_WEBHOOK_URL
        sync: false
      - key: EVENTS_WEBHOOK_SECRET
        sync: false
      # Registro auxiliar de pedidos en Google Sheets (opcional; ver docs/google-sheets.md).
      # Las tres van juntas; la llave privada es un secreto: solo en el panel de Render.
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_SHEETS_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_SHEETS_PRIVATE_KEY
        sync: false
      # Correo a clientes y al dueño (opcional; ver docs/salir-a-produccion.md). Es el único aviso
      # al dueño de cada pago confirmado: Telegram no se usa (decisión del dueño, 2026-10-18).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
